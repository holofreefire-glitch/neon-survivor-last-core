<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060f" />
    <title>Neon Survivor: Last Core</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060f;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container canvas {
        display: block;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #05060f;
        z-index: 10;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }
      #boot-loader.hidden {
        opacity: 0;
      }
      .boot-ring {
        width: 64px;
        height: 64px;
        border: 3px solid rgba(0, 229, 255, 0.15);
        border-top-color: #00e5ff;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      .boot-title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        letter-spacing: 4px;
        color: #00e5ff;
        text-transform: uppercase;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script src="https://sdk.games.s3.yandex.net/sdk.js"></script>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="boot-loader">
      <div class="boot-ring"></div>
      <div class="boot-title">Neon Survivor</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
